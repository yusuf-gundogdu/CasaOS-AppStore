name: libredb-studio
services:
  libredb-studio:
    image: libredb/libredb-studio:0.17.0
    container_name: libredb-studio
    restart: unless-stopped
    ports:
      - target: 3000
        published: "3016"
        protocol: tcp
    environment:
      ADMIN_EMAIL: admin@libredb.org
      ADMIN_PASSWORD: ""
      JWT_SECRET: ""
      STORAGE_PROVIDER: sqlite
      STORAGE_SQLITE_PATH: /app/data/libredb-storage.db
      AUTH_COOKIE_SECURE: "false"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/db/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: bridge
    privileged: false
    x-casaos:
      envs:
        - container: ADMIN_EMAIL
          description:
            en_US: Email address for the initial admin account created on first start.
            zh_CN: 首次启动时创建的初始管理员账户的电子邮件地址。
        - container: ADMIN_PASSWORD
          description:
            en_US: Leave empty and the app generates a strong password on first start and prints it once to the container log. Set your own only if you prefer to choose it.
            zh_CN: 留空时，应用会在首次启动时生成强密码并在容器日志中打印一次。仅在希望自行指定时填写。
        - container: JWT_SECRET
          description:
            en_US: Leave empty and a strong secret is generated on first start. This value also encrypts saved connection passwords, so never reuse a value published anywhere. If you set your own it must be at least 32 characters, or the container exits at boot.
            zh_CN: 留空时会在首次启动时生成强密钥。该值同时用于加密已保存的连接密码，因此切勿使用任何公开过的值。如自行设置，长度至少为 32 个字符，否则容器将在启动时退出。
        - container: STORAGE_PROVIDER
          description:
            en_US: Storage backend. Keep as "sqlite" for a self-contained setup.
            zh_CN: 存储后端。独立部署请保持为 "sqlite"。
        - container: STORAGE_SQLITE_PATH
          description:
            en_US: Path to the SQLite database file inside the persistent data volume.
            zh_CN: 持久化数据卷内 SQLite 数据库文件的路径。
        - container: AUTH_COOKIE_SECURE
          description:
            en_US: Keep "false" so the auth cookie works over plain HTTP on the LAN, otherwise login fails.
            zh_CN: 请保持为 "false"，以便身份验证 Cookie 在局域网的普通 HTTP 下正常工作，否则将无法登录。
      ports:
        - container: "3000"
          description:
            en_US: WebUI HTTP Port
            zh_CN: WebUI HTTP 端口
          protocol: tcp
      volumes:
        - container: /app/data
          description:
            en_US: LibreDB Studio data directory (SQLite database).
            zh_CN: LibreDB Studio 数据目录（SQLite 数据库）。
x-casaos:
  id: org.icewhale.libredbstudio
  architectures:
    - amd64
    - arm64
  main: libredb-studio
  author: libredb
  category: Developer
  description:
    en_US: LibreDB Studio is an open-source (MIT), self-hosted SQL IDE. It provides a modern web-based interface to connect to 18 database engines (PostgreSQL, MySQL, MongoDB, Redis, ClickHouse, Prometheus, Apache Kafka and more), browse schemas, and write and run queries from any browser on your LAN. Five of the eighteen are read-only, because their own APIs are. Data is stored locally in a SQLite database, so everything stays under your control.
    zh_CN: LibreDB Studio 是一款开源（MIT）的自托管 SQL IDE。它提供现代化的基于 Web 的界面，支持连接 18 种数据库引擎、浏览架构，并可通过局域网中的任意浏览器编写和运行查询。其中五种为只读，因为它们自身的 API 即为只读。数据本地存储于 SQLite 数据库中，一切尽在您的掌控之中。
  developer: libredb
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/icon.svg
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/screenshot-3.png
  tagline:
    en_US: Open-source self-hosted SQL IDE.
    zh_CN: 开源自托管 SQL IDE。
  thumbnail: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/thumbnail.png
  title:
    en_US: LibreDB Studio
    zh_CN: LibreDB Studio
  index: /
  scheme: http
  port_map: "3016"
  version: "0.17.0"
  update_at: "2026-09-26"
  release_notes:
    en_US: |-
      - Updates LibreDB Studio to 0.17.0. Two engines join, taking the count to 18: Prometheus, read over its HTTP API in PromQL, and Apache Kafka, whose topics, consumer groups and brokers are read over the Kafka protocol. Both are read-only, because this release calls no write, admin or lifecycle endpoint on either.
      - Studio serves the Model Context Protocol at `/api/mcp`, so an AI client you already use can list connections, inspect a schema and run one read-only `SELECT` while the database credentials stay on the server. It is off until an operator turns it on, each user mints a bearer token that is shown once, and only connections explicitly marked for it are visible.
      - The image is rebuilt on Node 26.9.0, which clears three critical `perl-base` advisories that the 0.16.x images carried.
      - The previous release, 0.16.2, closed `GHSA-3wh2-8x78-jfw4`, scored 8.8. If this instance is still on 0.16.1 or older and more than one account reaches it, upgrade rather than wait.
    zh_CN: |-
      - 将 LibreDB Studio 更新至 0.17.0。新增两种引擎，总数达到 18 种：Prometheus 通过其 HTTP API 以 PromQL 读取，Apache Kafka 通过 Kafka 协议读取主题、消费者组和 broker。两者均为只读，本次发布不会对它们调用任何写入、管理或生命周期接口。
      - Studio 在 `/api/mcp` 上提供 Model Context Protocol 服务，你现有的 AI 客户端可以列出连接、查看结构并执行一条只读 `SELECT`，数据库凭据始终留在服务端。该功能默认关闭，需管理员开启；每位用户生成的 bearer token 只显示一次，且只有被显式标记的连接才可见。
      - 镜像基于 Node 26.9.0 重新构建，修复了 0.16.x 镜像中存在的三个 `perl-base` 严重漏洞。
      - 上一版本 0.16.2 修复了评分 8.8 的 `GHSA-3wh2-8x78-jfw4`。若本实例仍在 0.16.1 或更早版本且有多个账户可访问，请尽快升级。
  website: https://libredb.org
  repo: https://github.com/libredb/libredb-studio
  support: https://github.com/libredb/libredb-studio/issues
  docs: https://github.com/libredb/libredb-studio/tree/main/docs
